on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          binary_name="redyl-${{ needs.release-please.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p bin
          if [ "$GOOS" = "windows" ]; then
            go build \
              -ldflags "-X github.com/pbs/redyl/internal/redyl/version.Version=${{ needs.release-please.outputs.version }}" \
              -o "bin/${binary_name}.exe" .
            zip -j "bin/${binary_name}.zip" "bin/${binary_name}.exe"
            rm "bin/${binary_name}.exe"
          else
            go build \
              -ldflags "-X github.com/pbs/redyl/internal/redyl/version.Version=${{ needs.release-please.outputs.version }}" \
              -o "bin/${binary_name}" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redyl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/

  upload-assets:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in bin/*; do
            gh release upload "${{ needs.release-please.outputs.tag_name }}" "$file" \
              --repo "${{ github.repository }}" \
              --clobber
          done
